<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8C0"/>
      <stop offset="45%" stop-color="#F0CC50"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <linearGradient id="left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#7A5414"/>
    </linearGradient>
    <linearGradient id="right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7228"/>
      <stop offset="100%" stop-color="#4A2E06"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#0c0b09"/>

  <!-- Ground shadow -->
  <ellipse cx="16" cy="27.5" rx="9.5" ry="1.8" fill="rgba(0,0,0,0.45)"/>

  <!-- Top face -->
  <polygon points="16,5 27,10.5 16,16 5,10.5" fill="url(#top)"/>
  <!-- Left face -->
  <polygon points="5,10.5 16,16 16,24.5 5,19" fill="url(#left)"/>
  <!-- Right face -->
  <polygon points="16,16 27,10.5 27,19 16,24.5" fill="url(#right)"/>

  <!-- Raised platform highlight on top face -->
  <polygon points="16,7.5 23.5,11.2 16,14.5 8.5,10.8" fill="#F5D76E" opacity="0.28"/>

  <!-- Specular top edge -->
  <polyline points="5,10.5 16,5 27,10.5" stroke="#FFFBD5" stroke-width="0.8" fill="none" opacity="0.65" stroke-linejoin="round"/>
  <line x1="16" y1="5" x2="16" y2="16" stroke="#FFFBD5" stroke-width="0.5" opacity="0.25"/>

  <!-- Engraved lines on top face -->
  <line x1="9" y1="10" x2="23" y2="14.2" stroke="#B8922A" stroke-width="0.6" opacity="0.5"/>
  <line x1="9" y1="11.5" x2="23" y2="15.7" stroke="#B8922A" stroke-width="0.6" opacity="0.5"/>
</svg>
